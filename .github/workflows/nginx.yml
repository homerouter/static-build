name: Build Nginx

on:
  push:
    branches:
      - main
    paths:
      - 'nginx/**'
      - 'nginx.sh'
      - '.github/workflows/nginx.yml'
    tags:
      - '[0-9][0-9][0-9][0-9][0-9][0-9]'
      - 'v[0-9][0-9][0-9][0-9][0-9][0-9]'
      - 'nginx-v*'
      - 'v*'
  pull_request:
    paths:
      - 'nginx/**'
      - 'nginx.sh'
      - '.github/workflows/nginx.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nginx version to build'
        required: false
        default: '1.31.8'
      tag:
        description: 'Release tag (leave empty for YYMMDD)'
        required: false
        default: ''

concurrency:
  group: nginx-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build static nginx deb (${{ matrix.deb_arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            platform: linux/amd64
          - deb_arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version || '' }}" ]; then
            VER="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]] && [[ ! "${GITHUB_REF_NAME}" =~ ^v?[0-9]{6}$ ]]; then
            TAG="${GITHUB_REF_NAME}"
            TAG="${TAG#nginx-}"
            VER="${TAG#v}"
          else
            VER="1.31.8"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building Nginx version: ${VER} for ${{ matrix.deb_arch }}"

      - name: Build static Nginx and package deb
        env:
          VER_NGINX: ${{ steps.meta.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e VER_NGINX="$VER_NGINX" \
            alpine:3.20 sh -ec 'apk add --no-cache bash; bash /work/nginx.sh'

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ steps.meta.outputs.version }}-${{ matrix.deb_arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Check and generate checksums
        run: |
          cd dist-release
          ls -la
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          cd dist-release
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(date +%y%m%d)"
          fi
          echo "Publishing Nginx packages to release: $TAG"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Static build release $TAG" || true
          fi
          gh release upload "$TAG" * --clobber
