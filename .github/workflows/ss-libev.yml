name: Build shadowsocks-libev

on:
  workflow_dispatch:
  push:
    branches: [shadowsocks-libev]
    paths:
      - ss-libev.sh
      - .github/workflows/ss-libev.yml
    tags: ['ss-libev-v*']
  pull_request:
    paths:
      - ss-libev.sh
      - .github/workflows/ss-libev.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and check static binaries
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            alpine:3.23 sh -ec 'apk add --no-cache bash; bash ss-libev.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: shadowsocks-libev-linux-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/ss-libev-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shadowsocks-libev-linux-x86_64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
