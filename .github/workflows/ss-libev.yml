name: Build shadowsocks-libev

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (leave empty for artifacts only)
        type: string
        required: false
  push:
    branches: [shadowsocks-libev]
    paths:
      - ss-libev.sh
      - .github/workflows/ss-libev.yml
    tags: ['v*', 'ss-libev-v*']
  pull_request:
    paths:
      - ss-libev.sh
      - .github/workflows/ss-libev.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Build and check static binaries
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            alpine:latest sh -ec 'apk add --no-cache bash; bash ss-libev.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: shadowsocks-libev-linux-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shadowsocks-libev-linux-x86_64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
          fi
